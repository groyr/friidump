[package]
name = "friidump"
version = "0.6.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "GameCube / Wii ディスク吸い出し CLI"

[[bin]]
name = "friidump"
path = "src/main.rs"

[lib]
name = "friidump"
path = "src/lib.rs"

[dependencies]
crc32fast = "1.5.2"
md-5 = "0.11.0"
sha1 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

name: Release

# タグ（v*）を push すると、Windows と Linux armv6 のバイナリをビルドして Release に添付する。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
      - name: Configure
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC_BINARY=ON \
                -DHAVE_STDBOOL_H=1 -DHAVE_FSEEKO=1 -DCMAKE_WORDS_BIGENDIAN=0 -B build
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          mkdir -p dist
          cp build/src/friidump.exe dist/
          cp README COPYING AUTHORS dist/
          (cd dist && zip -r ../friidump-${GITHUB_REF_NAME}-win64.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: friidump-*-win64.zip

  linux-armv6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf cmake ninja-build zip
      - name: Configure
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=cmake/armv6-toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC_BINARY=ON \
                -DHAVE_STDBOOL_H=1 -DHAVE_FSEEKO=1 -DHAVE_FTELLO=1 \
                -DHAVE_FSEEK64=0 -DHAVE_FTELL64=0 \
                -DCMAKE_WORDS_BIGENDIAN=0 \
                -DCMAKE_EXE_LINKER_FLAGS="-static" -B build-armv6
      - name: Build
        run: cmake --build build-armv6
      - name: Package
        run: |
          mkdir -p dist
          cp build-armv6/src/friidump dist/
          cp README COPYING AUTHORS dist/
          (cd dist && zip -r ../friidump-${GITHUB_REF_NAME}-linux-armv6.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-armv6
          path: friidump-*-linux-armv6.zip

  release:
    needs: [windows-x64, linux-armv6]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true

name: Release

# タグ（v*）を push すると、Windows と Linux armv6 のバイナリをビルドして Release に添付する。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/friidump.exe dist/
          cp README COPYING AUTHORS dist/
          (cd dist && 7z a ../friidump-${GITHUB_REF_NAME}-win64.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: friidump-*-win64.zip

  linux-armv6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-gnueabihf
      # cross（Docker + QEMU）で armv6（Raspberry Pi Zero / armhf）バイナリをビルドする。
      - uses: taiki-e/install-action@cross
      - name: Build (armv6)
        run: cross build --release --target arm-unknown-linux-gnueabihf
      - name: Package
        run: |
          mkdir -p dist
          cp target/arm-unknown-linux-gnueabihf/release/friidump dist/
          cp README COPYING AUTHORS dist/
          (cd dist && zip -r ../friidump-${GITHUB_REF_NAME}-linux-armv6.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-armv6
          path: friidump-*-linux-armv6.zip

  release:
    needs: [windows-x64, linux-armv6]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          overwrite_files: true
          generate_release_notes: true
